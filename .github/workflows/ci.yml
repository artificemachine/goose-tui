name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-and-test:
    name: typecheck + tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      # The suites are self-contained: no goose, no sqlite3, no network.
      - name: Unit + integration tests
        run: bun run test

      - name: CLI entry points do not crash
        run: |
          bun src/index.ts --version
          bun src/index.ts --help > /dev/null
          bun src/index.ts update --help > /dev/null
          set +e
          # Redirect rather than pipe: in `... | tee` the status is tee's, not
          # rossii's, and doctor is expected to exit 1 without goose.
          bun src/index.ts doctor > /tmp/rossii-doctor.txt 2>&1
          status=$?
          set -e
          cat /tmp/rossii-doctor.txt
          test "$status" -eq 1
          grep -q "not found on PATH" /tmp/rossii-doctor.txt

  secret-scan:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # History, not just the tree: a secret deleted in a later commit is
          # still a secret, because a clone gets every object.
          fetch-depth: 0

      # No third-party action: the release is pinned by name *and* checksum, so
      # a retagged or replaced asset fails here instead of running.
      - name: Install gitleaks (pinned release, checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan every commit
        run: ./gitleaks git --redact --no-banner --exit-code 1 .
